provider: James M. Kilts Center for Marketing, University of Chicago Booth School of Business
dataset: Dominick's Finer Foods scanner data
catalog_url: https://www.chicagobooth.edu/research/kilts/research-data/dominicks
manual_url: https://www.chicagobooth.edu/research/kilts/research-data/-/media/enterprise/centers/kilts/datasets/dominicks-dataset/dominicks-manual-and-codebook_kiltscenter
manual_version: Created July 2013, updated October 2018
license: >
  Academic research purposes only. Working papers and publications that use
  any portion of the data must acknowledge the James M. Kilts Center,
  University of Chicago Booth School of Business. Raw files are not committed
  to this repository.
historical_scope: >
  Scanner archive of a defunct Chicago-area chain. Week 1 in the manual begins
  14 September 1989. Week 400 ends 14 May 1997. Cereals movement data end at
  week 399 (7 May 1997). Results are not estimates of current consumer behavior.

